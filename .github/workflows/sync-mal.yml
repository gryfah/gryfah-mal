name: Sync MAL

on:
  workflow_dispatch:

  # ChatGPT updates dedicated issue #1 to request an additional sync.
  issues:
    types: [edited]

  schedule:
    - cron: "43 * * * *"
      timezone: "Europe/Stockholm"

permissions:
  contents: write

concurrency:
  group: sync-mal
  cancel-in-progress: false

jobs:
  sync:
    # Ignore edits to all issues except the dedicated sync trigger.
    if: github.event_name != 'issues' || (github.event.issue.number == 1 && github.event.changes.body != null)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch MAL list
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: python sync_mal.py

      - name: Commit updated list
        run: |
          git config user.name "mal-sync-bot"
          git config user.email "mal-sync-bot@users.noreply.github.com"

          git add anime.json

          if git diff --cached --quiet; then
            echo "No MAL changes"
          else
            git commit -m "Update MAL list"
            git push
          fi
